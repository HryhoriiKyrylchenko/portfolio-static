<div class="about-page">

  <div class="about-content-container">
    @if (aboutImageUrl) {
      <div class="about-img-container">
        <div
          class="about-img"
          [ngStyle]="{ 'background-image': 'url(' + aboutImageUrl + ')' }"
          aria-hidden="true"
        ></div>
      </div>
    }

    <div class="about-content-container-inner">
      <h3 class="about-title">
        {{ 'about.title' | transloco }}
      </h3>

      <div class="about-content">
        @if (contentParagraphs$ | async; as contentParagraphs) {
          @for (paragraph of contentParagraphs; track $index) {
            <p class="content-paragraph">
              {{ paragraph }}
            </p>
          }
        }
      </div>
    </div>
  </div>


  <app-skills-matrix class="about-section"></app-skills-matrix>

  <app-credentials class="about-section"></app-credentials>
</div>
