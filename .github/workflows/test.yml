name: Test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test -- --watch=false

      - name: Build
        run: npm run build:pages
